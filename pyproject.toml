[project]
name = "chronosx"
version = "1.0.0+m5"
description = "ChronosX (amazon-science/chronos-forecasting, rama chronosx) simplificado para M5"
requires-python = ">=3.10"
dependencies = [
    "chronos-forecasting[training]==1.5.0",
    "transformers==4.47.1",
    "accelerate==0.34.2",
    "datasetsforecast==1.0.0",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronosx"]

[project.urls]
Upstream = "https://github.com/amazon-science/chronos-forecasting/tree/chronosx"
Paper = "https://arxiv.org/pdf/2503.12107"
